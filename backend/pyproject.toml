[project]
name = "moonwalkers"
version = "0.1.0"
description = "Backend for the MoonWalkers Multimodal Agentic Digital Twin Generation Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "trimesh>=5.1,<6",
    "usd-core>=26.8,<27",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set, plus all pycodestyle errors (line length) and import sorting (decision 0007)
extend-select = ["E", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "gpu: needs an NVIDIA GPU",
    "slow: takes more than a few seconds",
]

[dependency-groups]
dev = [
    "omniverse-asset-validator>=1.18,<2",
    "pypdf>=6.21,<7",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
