# .github/workflows/auto-label.yml
# Labels every pull request by the rules in .github/labeler.yml (actions/labeler).
# pull_request_target runs this file as it is on the BASE branch, with a token that can label
# PRs from forks too; it never checks out the PR's code, so the PR cannot change what runs.
name: "Pull Request Labeler"

on:
  - pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
