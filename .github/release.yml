# .github/release.yml
# Sections of GitHub's automatically generated release notes, by pull request label.
# Format: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
# A PR is listed once, under the FIRST category whose labels it carries, so order matters:
# a feature PR that also changes docs is listed under features.
# The labels come from .github/labeler.yml (applied by .github/workflows/auto-label.yml).

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes 🛠
      labels:
        - Semver-Major
        - breaking-change
    - title: New Features 🎉
      labels:
        - Semver-Minor
        - feature
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bug
    - title: Documentation 📚
      labels:
        - documentation
    - title: CI and Repository Tooling ⚙️
      labels:
        - ci
    - title: Other Changes
      labels:
        - "*"
